# Configuracion base del TP1.
#
# Cada ablacion de la Fase 9 es un archivo en configs/ablations/ que hereda de
# este y cambia UNA sola clave. Ningun script edita hiperparametros a mano.

run:
  name: base
  seed: 42
  seeds: [42, 43, 44, 45, 46]   # Fase 9: 5 semillas x 5 folds por configuracion

data:
  csv: data/raw/supermarket_products.csv
  splits_dir: data/splits
  target: bought
  group: query_id
  test_size: 0.20
  valid_size: 0.20      # dentro de dev, para desarrollo rapido y early stopping
  n_folds: 5            # GroupKFold sobre dev, para seleccion de modelo

features:
  use_text: true
  use_tabular: true
  text_fields: [title, description]
  # Las dos codificaciones del nivel de reputacion. Van separadas porque son
  # independientes entre si: la ablacion honesta de la Fase 9 apaga las dos.
  keep_suffix: true                # marcador entre parentesis del titulo
  keep_reputation_sentence: true   # ultima oracion de la descripcion
  scaler: standard                 # standard | quantile
  use_temporal: false              # ciclicas de timestamp: el EDA no les vio efecto
  numericas: [price, net_weight_oz, nutrition_score, filter_price_min, filter_price_max]
  derivadas: [price_pos, price_per_oz, dim_largo, dim_ancho, dim_alto, dim_volumen]
  categoricas: [category, brand, storage_type, country_of_origin, unit_of_measure, package_size, allergens]
  # Admitidas en la Fase 1 y descartadas en la Fase 4, con motivo en
  # src/data/features.py::COLUMNAS_DESCARTADAS.
  descartadas: [ingredients, timestamp]

tokenizer:
  kind: bpe             # entrenado sobre el corpus del TP, sin pesos externos
  vocab_size: 2000      # devuelve 1.355: el BPE satura ahi (622 tipos de palabra)
  max_len: 56           # MEDIDO: p99 = 52 sobre train, al multiplo de 8 siguiente
  special_tokens: ["[PAD]", "[UNK]", "[CLS]", "[SEP]"]
  # Grilla de la ablacion de vocabulario, reescalada hacia abajo: la del plan
  # ({1000, 2000, 4000, 8000}) da el mismo tokenizador de 2.000 en adelante.
  vocabs_ablacion: [256, 512, 1000, 2000]

model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 128
  dropout: 0.1
  activation: gelu
  norm: pre_ln
  pos_encoding: sinusoidal   # sinusoidal | learned | none
  pooling: cls               # cls | mean
  attn_impl: scratch         # scratch | torch_sdpa | torch_mha
  use_cross_item: false
  d_tab: 32
  cat_emb_dim: 12

train:
  epochs: 50
  batch_size: 256       # 64 en el plan; a esta escala el step es overhead puro
  lr: 1.0e-3            # escalado lineal con el batch (3e-4 x 4)
  weight_decay: 1.0e-2
  warmup_ratio: 0.10
  scheduler: cosine
  grad_clip: 1.0
  loss: bce                  # bce | bce_pos_weight | focal
  pos_weight: null
  early_stopping:
    metric: pr_auc
    patience: 10
  amp: false                 # fp32: a esta escala AMP no acelera y agrega no-determinismo
  num_workers: 0

eval:
  primary_metric: pr_auc     # average_precision_score
  secondary_metrics: [roc_auc, log_loss, brier]
  results_csv: experiments/results.csv
